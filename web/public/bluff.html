<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>唬牌 Bluff · 热座</title>
<link rel="stylesheet" href="/style.css" />
<style>
:root { --bg:#10141c; --panel:#181e29; --line:#2a3444; --fg:#e6ecf5; --dim:#8b9bb4; --gold:#d8a657; --bad:#e06c75; --good:#98c379; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif; }
header { display:flex; flex-wrap:wrap; gap:14px; align-items:center; padding:12px 18px; background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; }
h1 { font-size:17px; margin:0 10px 0 0; color:var(--gold); }
.badge { padding:2px 9px; border:1px solid var(--line); border-radius:999px; color:var(--dim); font-size:13px; }
.badge b { color:var(--fg); }
main { display:grid; grid-template-columns: 1fr 320px; gap:16px; padding:16px; align-items:start; }
@media (max-width: 900px) { main { grid-template-columns: 1fr; } }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; }
.turnbar { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
.turnbar .who { font-size:19px; font-weight:600; }
.cand { padding:4px 10px; margin-right:6px; font-size:13px; }
.cand.on { background:var(--gold); color:#191307; border-color:var(--gold); font-weight:700; }
.banner { background:#0d1219; border:1px solid var(--line); border-left:3px solid var(--gold); border-radius:8px; padding:9px 13px; margin-bottom:12px; font-size:15px; }
.seats { display:flex; gap:10px; flex-wrap:wrap; }
.seat { border:1px solid var(--line); border-radius:10px; padding:8px 12px; min-width:120px; }
.seat.active { border-color:var(--gold); box-shadow:0 0 0 2px rgba(216,166,87,.18); }
.seat .n { font-weight:600; }
.seat .c { color:var(--dim); font-size:13px; }
.hand { display:flex; flex-wrap:wrap; gap:6px; margin:14px 0; }

/* 牌面本身用 style.css 里那一套(和炸金花同一份,尺寸 74x86 / small 56x64,色系 class 通用);
   这里只加唬牌自己的两个标记:能当"真话"的牌、以及选中的牌 */
.card.honest { box-shadow:0 0 0 2px #4c9a5a; }
.card.honest.sel { box-shadow:0 0 0 3px var(--gold); }
.card.pick { transform:translateY(-4px); }
.hand { display:flex; flex-wrap:wrap; gap:6px; }
.btns { display:flex; gap:10px; flex-wrap:wrap; }
button { background:#222c3c; color:var(--fg); border:1px solid var(--line); border-radius:9px; padding:9px 16px; font-size:15px; cursor:pointer; }
button.primary { background:var(--gold); color:#191307; border-color:var(--gold); font-weight:700; }
button.danger { border-color:var(--bad); color:var(--bad); }
button:disabled { opacity:.4; cursor:default; }
.log .now { color:var(--gold); font-weight:600; }
.log { max-height:300px; overflow:auto; font:12px/1.7 ui-monospace,Consolas,monospace; color:var(--dim); white-space:pre-wrap; }
.ex { white-space:pre-wrap; font:13px/1.8 ui-monospace,Consolas,monospace; color:#cfd8e3; }
.row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:8px 0; }
select, input { background:#0d1219; color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:6px 8px; }
.hint { color:var(--dim); font-size:13px; }
#toast { position:fixed; left:50%; bottom:26px; transform:translateX(-50%); background:#2b1d1d; border:1px solid var(--bad); color:#f0c9c9; padding:9px 18px; border-radius:9px; display:none; }
</style>
</head>
<body>
<header>
  <h1>唬牌 Bluff</h1>
  <span class="badge">第 <b id="handNo">-</b> 局 / 第 <b id="matchNo">-</b> 盘</span>
  <span class="badge">癞子 <b id="wild">-</b></span>
  <span class="badge">本回合点数 <b id="rank">-</b></span>
  <span class="badge">牌堆 <b id="pile">0</b> 张</span>
  <span class="badge" id="bustMode">-</span>
</header>
<main>
  <section class="panel">
    <div class="turnbar">
      <span class="who" id="turnWho">-</span>
      <span class="hint" id="turnHint"></span>
    </div>
    <div class="banner" id="banner">-</div>
    <div class="seats" id="seats"></div>
    <div class="row" id="candRow" style="display:none">
      <span class="hint">本回合点数(选一个报):</span>
      <span id="cands"></span>
    </div>
    <div class="hand" id="hand"></div>
    <div class="btns">
      <button class="primary" id="btnPlay" disabled>出牌(选中的几张)</button>
      <button class="danger" id="btnChal" disabled>质疑上一手</button>
      <button id="btnNext" style="display:none">下一局</button>
    </div>
    <div class="row">
      <label class="hint" title="热座:轮到人类座位时会自动跟随,一般不用改">你在座位</label>
      <select id="seatSel"><option value="0">0 · 我</option><option value="1">1</option><option value="2">2</option><option value="3">3</option></select>
      <label class="hint">对家1</label>
      <select id="kind1"><option value="Lao6">Lao6 老六</option><option value="Bajiao" selected>Bajiao 芭蕉</option><option value="Nizi">Nizi 妮子</option><option value="Nannan">Nannan 囡囡</option><option value="random">随机</option><option value="Lynn">Lynn 自进化</option><option value="Xiaozhen">Xiaozhen 小针(精准狙击)</option><option value="Caocao">Caocao 曹操(多疑 · 数据发现)</option><option value="llm:glm">GLM</option><option value="llm:ds">DeepSeek</option></select>
      <label class="hint">对家2</label>
      <select id="kind2"><option value="Lao6">Lao6 老六</option><option value="Bajiao">Bajiao 芭蕉</option><option value="Nizi" selected>Nizi 妮子</option><option value="Nannan">Nannan 囡囡</option><option value="random">随机</option><option value="Lynn">Lynn 自进化</option><option value="Xiaozhen">Xiaozhen 小针(精准狙击)</option><option value="Caocao">Caocao 曹操(多疑 · 数据发现)</option><option value="llm:glm">GLM</option><option value="llm:ds">DeepSeek</option></select>
      <label class="hint">对家3</label>
      <select id="kind3"><option value="Lao6">Lao6 老六</option><option value="Bajiao">Bajiao 芭蕉</option><option value="Nizi">Nizi 妮子</option><option value="Nannan" selected>Nannan 囡囡</option><option value="random">随机</option><option value="Lynn">Lynn 自进化</option><option value="Xiaozhen">Xiaozhen 小针(精准狙击)</option><option value="Caocao">Caocao 曹操(多疑 · 数据发现)</option><option value="llm:glm">GLM</option><option value="llm:ds">DeepSeek</option></select>
    </div>
    <div class="row">
      <label class="hint">爆牌线</label>
      <select id="bustSel"><option value="tight">40(火爆局)</option><option value="loose">52(技术局)</option></select>
      <label class="hint">抽点数</label>
      <select id="drawSel"><option value="one">每回合抽 1 个(难度高)</option><option value="choose3">抽 3 个我选 1 个(有主动权)</option></select>
      <label class="hint">质疑规则</label>
      <select id="chalSel">
        <option value="standard" selected>+3/-5 私下记账(盘末揭晓)</option>
        <option value="light">+2/-5 私下记账</option>
        <option value="off">不算质疑分</option>
      </select>
      <label class="hint">AI 出手速度</label>
      <select id="speedSel"><option value="900">慢(看得清)</option><option value="420" selected>中</option><option value="120">快</option><option value="0">不停顿</option></select>
      <button id="btnNew" class="primary">开新盘</button>
      <span class="hint" id="paceHint"></span>
    </div>
    <div class="hint">提示:选中牌后点「出牌」= 宣告这几张都是本回合点数(可以撒谎 ✓);癞子可当任意点数 ✓</div>
  </section>
  <aside class="panel">
    <div style="font-weight:600;margin-bottom:6px">局末展览</div>
    <div class="ex" id="chalReveal" style="display:none"></div>
    <div class="ex" id="ex">(打到这里会翻开牌堆真容 + 每人的谎话账本)</div>
    <div style="font-weight:600;margin:14px 0 6px">对局日志</div>
    <div class="log" id="log"></div>
  </aside>
</main>
<div id="toast"></div>
<script>
var view = null, sel = new Set(), seat = 0, busy = false, timer = null, picked = null;
var autoFollow = true;   // 轮到人类座位时自动跟随过去(热座的关键:不然会卡死)
function $(id) { return document.getElementById(id); }
function toast(msg) { var t = $('toast'); t.textContent = msg; t.style.display = 'block'; setTimeout(function () { t.style.display = 'none'; }, 2600); }
function esc(s) { return String(s).replace(/[<>&]/g, function (c) { return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]; }); }
function api(path, body) {
  return fetch(path, body ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) } : undefined)
    .then(function (r) {
      if (!r.ok) throw new Error('接口 ' + path + ' 返回 HTTP ' + r.status + (r.status === 404 ? '(服务端可能是旧进程 / 页面是旧缓存,请重启服务端并 Ctrl+F5)' : ''));
      return r.json();
    })
    .catch(function (e) { console.error('[bluff]', e); toast(String(e.message || e)); throw e; });
}
function render() {
  if (!view) return;
  // 关键:如果当前该行动的是一个「人类座位」,而我的视角不在那里 → 自动跟随
  // (不做这一步,热座换过座位后就会卡死:谁都点不动 ✓ 这是实测踩到的坑)
  var turnSeat = view.seats[view.turn];
  if (autoFollow && turnSeat && turnSeat.kind === 'human' && view.turn !== seat && !view.handOver && !view.over) {
    seat = view.turn;
    $('seatSel').value = String(seat);
    sel.clear();
    toast('已自动切到座位 ' + seat + '(' + turnSeat.name + ')—— 轮到人类玩家');
    refreshOnce().then(render);
    return;
  }
  $('handNo').textContent = view.handNo; $('matchNo').textContent = view.matchNo;
  $('wild').textContent = view.wildText; $('rank').textContent = view.roundText;
  $('pile').textContent = view.pileCount;
  $('bustMode').textContent = ($('bustSel').value === 'loose' ? '爆牌线 52' : '爆牌线 40');
  var mine = view.turn === seat;
  $('turnWho').textContent = view.over ? '一盘结束' : (view.handOver ? '本局结束' : (mine ? '轮到你' : '轮到 ' + view.seats[view.turn].name));
  $('turnHint').textContent = view.over ? '' : (view.handOver ? '本局结束,点「下一局」' : (mine ? '轮到你了:选 1~5 张牌,或质疑上一手' : '等 ' + view.seats[view.turn].name + ' 出牌(座位 ' + view.turn + ')'));
  $('turnWho').textContent = view.over ? '一盘结束' : (view.handOver ? '本局结束' : (mine ? '轮到你' : '轮到 ' + view.seats[view.turn].name));
  var last = view.log.length ? view.log[view.log.length - 1] : '';
  $('banner').textContent = last || '-';
  $('seats').innerHTML = view.seats.map(function (s) {
    return '<div class="seat ' + (s.seat === view.turn ? 'active' : '') + '"><div class="n">' + esc(s.name) + (s.seat === seat ? ' (我)' : '') + '</div>' +
      '<div class="c">' + s.cards + ' 张 · ' + s.points + ' 分</div><div class="c">' + esc(s.kind) + '</div></div>';
  }).join('');
  $('hand').innerHTML = view.hand.map(function (c) {
    var cls = 'card small ' + (c.family ? c.family.toLowerCase() : '') + (c.honest ? ' honest' : '') + (sel.has(c.id) ? ' sel' : '');
    return '<div class="' + cls + '" data-id="' + c.id + '" title="' + (c.honest ? '能当本回合点数(真话素材)' : '假话素材') + '">' + c.text + '</div>';
  }).join('');
  Array.prototype.forEach.call(document.querySelectorAll('.card'), function (el) {
    el.onclick = function () {
      var id = el.getAttribute('data-id');
      if (sel.has(id)) sel.delete(id); else { if (sel.size < view.legal.maxPlay) sel.add(id); else toast('最多出 ' + view.legal.maxPlay + ' 张'); }
      render();
    };
  });
  var cand = view.candidates || [];
  $('candRow').style.display = cand.length > 1 ? 'flex' : 'none';
  if (cand.length > 1) {
    if (!cand.some(function (c) { return c.rank === picked; })) picked = cand[0].rank;
    $('cands').innerHTML = cand.map(function (c) {
      return '<button class="cand ' + (c.rank === picked ? 'on' : '') + '" data-rank="' + c.rank + '">' + c.text + '(我有 ' + c.mineHonest + ' 张真的)</button>';
    }).join('');
    Array.prototype.forEach.call(document.querySelectorAll('.cand'), function (b) {
      b.onclick = function () { picked = Number(b.getAttribute('data-rank')); render(); };
    });
  }
  var canAct = mine && !view.handOver && !view.over;
  $('btnPlay').disabled = !canAct || sel.size < 1;
  var showRank = (cand.length > 1 && picked !== null) ? (cand.filter(function (c) { return c.rank === picked; })[0] || {}).text : view.roundText;
  $('btnPlay').textContent = '出牌(' + sel.size + ' 张,报全是 ' + showRank + ')';
  $('btnChal').disabled = !canAct || !view.legal.canChallenge;
  // 按钮为什么不能点,要说出来(不然就是「点了没反应」)
  $('btnPlay').title = canAct ? '' : (view.over ? '一盘已结束' : view.handOver ? '本局已结束' : '现在轮到 ' + view.seats[view.turn].name + '(座位 ' + view.turn + '),还没到你');
  $('btnChal').title = canAct ? (view.legal.canChallenge ? '' : '没有可质疑的上一手') : '现在轮到 ' + view.seats[view.turn].name;
  $('btnNext').style.display = view.handOver && !view.over ? 'inline-block' : 'none';
  $('ex').textContent = view.exhibition ? view.exhibition.text : '(打到这里会翻开牌堆真容 + 每人的谎话账本)';
  // 质疑账本:盘中一律不显示,只有一盘结束才揭晓 ✓
  if (view.challengeReveal) {
    var r = view.challengeRule;
    $('chalReveal').style.display = 'block';
    $('chalReveal').innerHTML = '<b>质疑账本揭晓</b>(规则 成功+' + r.win + '/失败-' + r.fee + ',成功次数奖金 ' + r.winsBonus + ' 分/次)<br>' +
      view.challengeReveal.map(function (x) {
        return '&nbsp;&nbsp;' + x.name + ': 质疑分 ' + (x.ledger >= 0 ? '+' : '') + x.ledger + ' · 猜对 ' + x.wins + ' 次 · **补分 ' + (x.bonus >= 0 ? '+' : '') + x.bonus + '**';
      }).join('<br>');
  } else {
    $('chalReveal').style.display = 'none';
  }
  $('log').innerHTML = view.log.map(function (t, i) {
    return '<div class="' + (i === view.log.length - 1 ? 'now' : '') + '">' + esc(t) + '</div>';
  }).join('');
  $('banner').textContent = last ? last : '-';
}
async function tick() {
  if (busy || !view) return;
  if (view.over || view.handOver) { render(); return; }
  if (view.turn === seat) { render(); return; }
  busy = true;
  try {
    var r = await api('/api/bluff/step', { seat: seat });
    if (r.ok) { view = r.view; render(); }
  } catch (e) { /* api 已经提示过了 */ }
  finally { busy = false; }
  schedule();
}
function schedule() { clearTimeout(timer); var d = Number($('speedSel').value); timer = setTimeout(tick, isFinite(d) ? d : 400); }
function refreshOnce() { return api('/api/bluff/state?seat=' + seat).then(function (r) { if (r.ok) { view = r.view; render(); } }); }
$('btnPlay').onclick = function () {
  api('/api/bluff/action', { seat: seat, type: 'PLAY', cardIds: Array.from(sel), declaredRank: picked }).then(function (r) {
    if (!r.ok) { toast(r.error); return; }
    sel.clear(); view = r.view; render(); schedule();
  });
};
$('btnChal').onclick = function () {
  api('/api/bluff/action', { seat: seat, type: 'CHALLENGE' }).then(function (r) {
    if (!r.ok) { toast(r.error); return; }
    view = r.view; render(); schedule();
  });
};
$('btnNext').onclick = function () { api('/api/bluff/action', { seat: seat }).then(function (r) { if (r.ok) { view = r.view; render(); schedule(); } }); };
$('seatSel').onchange = function () { seat = Number(this.value); sel.clear(); refreshOnce().then(schedule); };
$('speedSel').onchange = function () { schedule(); };
$('btnNew').onclick = function () {
  var kinds = ['human', $('kind1').value, $('kind2').value, $('kind3').value];
  api('/api/bluff/new', { bust: $('bustSel').value, draw: $('drawSel').value, challenge: $('chalSel').value, seats: kinds }).then(function (r) {
    if (!r.ok) { toast(r.error); return; }
    view = r.view; sel.clear(); render(); schedule();
  });
};
api('/api/bluff/new', { bust: $('bustSel').value, draw: $('drawSel').value, challenge: $('chalSel').value, seats: ['human', $('kind1').value, $('kind2').value, $('kind3').value] })
  .then(function (r) { if (r.ok) { view = r.view; render(); schedule(); } })
  .catch(function () { });
</script>
</body>
</html>
